# H2 en modo MySQL para que data.sql (INSERT IGNORE) sea compatible
spring.datasource.url=jdbc:h2:mem:trekking_ecommerce;MODE=MySQL;NON_KEYWORDS=VALUE;NON_KEYWORDS=VALUE;TRACE_LEVEL_SYSTEM_OUT=0;COLLATION=UTF8_GENERAL_CI
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
# Hibernate crea las tablas primero, luego corre data.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
