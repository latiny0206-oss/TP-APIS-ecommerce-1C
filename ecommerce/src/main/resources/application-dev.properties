spring.datasource.url=jdbc:mysql://localhost:3306/trekking_ecommerce?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.trekking=DEBUG
logging.level.org.hibernate.SQL=DEBUG
# Seed automático: Hibernate crea las tablas primero, luego corre data.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
