spring.config.import=optional:file:.env[.properties]
spring.application.name=trekking-ecommerce
# Perfil por defecto para facilitar desarrollo local en cualquier SO
spring.profiles.default=local
# JPA / Hibernate
spring.jpa.open-in-view=false
logging.level.com.trekking=INFO
# App
server.port=${SERVER_PORT:8080}
# Consola H2 desactivada por defecto (se habilita en perfil local)
spring.h2.console.enabled=false
# SQL init desactivado globalmente; los perfiles MySQL lo activan explícitamente
spring.sql.init.mode=never
# JWT
jwt.secret=${JWT_SECRET:ClaveSecretaTrekkingEcommerce2024MuyLarga}
jwt.expiration=86400000
# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Subida de fotos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
# Mail — si MAIL_HOST no está definido, los mensajes solo se guardan en BD
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:noreply@cumbre.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
contact.email.to=${CONTACT_TO:contacto@cumbre.com}

# Resend API
resend.api.key=${RESEND_API_KEY:}